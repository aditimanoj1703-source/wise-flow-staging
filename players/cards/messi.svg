<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1080 1920" width="1080" height="1920">

  <!-- Background -->
  <rect width="1080" height="1920" fill="#74ACDF"/>

  <!-- Player image / placeholder -->
  <rect x="0" y="200" width="1080" height="1200" fill="#74ACDF" opacity="0.25"/><text x="540" y="800" font-size="320" text-anchor="middle" dominant-baseline="middle">🇦🇷</text>
  

  <!-- Top bar -->
  <rect x="0" y="0" width="1080" height="180" fill="#74ACDF"/>
  <rect x="0" y="170" width="1080" height="8" fill="#FFFFFF"/>

  <!-- Flag emoji top-left -->
  <text x="60" y="135" font-size="110" dominant-baseline="middle">🇦🇷</text>

  <!-- Country name top-right -->
  <text x="1020" y="90" font-family="Arial Black,sans-serif" font-size="72"
        fill="#FFFFFF" text-anchor="end" font-weight="900">Argentina</text>

  <!-- Bottom name plate -->
  <rect x="0" y="1680" width="1080" height="240" fill="#74ACDF" opacity="0.92"/>
  <rect x="0" y="1680" width="1080" height="6" fill="#FFFFFF"/>

  <text x="540" y="1780" font-family="Arial Black,sans-serif" font-size="96"
        fill="#FFFFFF" text-anchor="middle" font-weight="900"
        letter-spacing="2">LIONEL MESSI</text>

  
</svg>
